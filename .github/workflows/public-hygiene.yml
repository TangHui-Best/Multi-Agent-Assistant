name: Public Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan:
    name: Scan public repository traces
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run public hygiene scanner
        env:
          PUBLIC_HYGIENE_FORBIDDEN_PATTERNS: ${{ secrets.PUBLIC_HYGIENE_FORBIDDEN_PATTERNS }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            commit_range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            commit_range="${{ github.sha }}"
          else
            commit_range="${{ github.event.before }}..${{ github.sha }}"
          fi

          python scripts/public_hygiene.py --root . --require-rules --require-env-rules --require-commit-range --commit-range "$commit_range"
